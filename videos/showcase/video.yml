# movement showcase: a silent, looping promo video (first shown at SfN 2026).
# Render with `uv run --group video movement-video render videos/showcase`.

name: movement_showcase  # output: media/movement_showcase_<YYYY-MM-DD>_<res>.mp4

# Rendered separately, in order, then joined without re-encoding
segments:
  - module: s01_io
    scene: IO
  - module: s02_clean_viz
    scene: CleanViz
  - module: s03_quantify
    scene: Quantify
  - module: s04_gui
    scene: GUI
  - module: s05_community
    scene: Community

# Fetched through movement.sample_data
sample_data:
  - filename: DLC_single-mouse_DBTravelator_2D.predictions.h5
    with_video: true
  - filename: DLC_single-mouse_EPM.predictions.h5
    with_video: true

# Files in inputs/, not committed (third-party, or too large). Put each one
# there by hand; `movement-video check` compares them with these hashes, and
# `movement-video update-hashes` records new ones. Keep `file` first in each
# entry. "NIU Dropbox" paths are relative to the NIU resources folder; logos
# from there were converted to RGBA and some trimmed to their visible content
# when copied, so the hash identifies the exact file used.
inputs:
