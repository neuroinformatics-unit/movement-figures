# movement showcase: a silent, looping promo video.
# Render with `uv run --group video movement-video render videos/showcase`.

name: movement_showcase  # output: media/movement_showcase_<YYYY-MM-DD>_<res>.mp4

# Each segment is rendered separately, in order, then joined without re-encoding.
# Map each segment to a .py module in `scenes/` that contains the
# manim scene to render.
segments:
  - module: s01_io
    scene: IO
  - module: s02_clean_viz
    scene: CleanViz
  - module: s03_quantify
    scene: Quantify
  - module: s04_gui
    scene: GUI
  - module: s05_community
    scene: Community

# Fetched through movement.sample_data
sample_data:
  - filename: DLC_single-mouse_DBTravelator_2D.predictions.h5
    with_video: true
  - filename: DLC_single-mouse_EPM.predictions.h5
    with_video: true

# Files in inputs/, not committed. Put them there before rendering.
# Keep `file` first in each entry. Logos were converted to RGBA and some were
# trimmed to their visible content.
#
# Hashes identify the exact file used/
# `movement-video check` compares them with these hashes, and
# `movement-video update-hashes` records new ones.
